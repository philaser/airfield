<!doctype html><html><meta charset="utf-8"><title>Airfield transition review</title><link rel="stylesheet" href="/src/styles.css"><style>body{padding:40px}svg{width:300px;height:100px}.controls{display:flex;gap:20px;margin:20px 0}table{max-width:500px}</style><h1>Transition component check</h1><p>Test specimens, not live traffic.</p><div id="review"></div><script type="module">
import React,{useState} from 'react';import{createRoot}from'react-dom/client';import{usePresence}from'/src/usePresence.js';
const h=React.createElement;function Review(){const[items,setItems]=useState([]),entries=usePresence(items,'test');return h(React.Fragment,null,h('div',{className:'controls'},h('button',{onClick:()=>setItems([{id:'test',label:'Aircraft test'}])},'Add target'),h('button',{onClick:()=>setItems([])},'Remove target')),h('svg',{viewBox:'0 0 300 100'},entries.map(f=>h('g',{key:f.id,'data-test-marker':true,className:'traffic-presence '+(f.exiting?'is-leaving':'')},h('circle',{cx:80,cy:50,r:15,fill:'#dd5b24'})))),h('table',null,h('tbody',null,entries.map(f=>h('tr',{key:f.id,'data-test-row':true,className:'traffic-presence '+(f.exiting?'is-leaving':'')},h('td',null,f.label))))));}createRoot(document.getElementById('review')).render(h(Review));
</script></html>
