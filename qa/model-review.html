<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airfield — Model scale review</title><style>body{background:#0c141b;color:#d7dfdf;font:14px system-ui;margin:35px}h1{font-weight:300}main{display:flex;flex-wrap:wrap;gap:20px}article{width:180px;border-top:1px solid #34444e}article>svg{display:block;width:180px;height:180px;color:#d7dfdf}p{font-size:12px;color:#91a5ad}.orientation-unknown{opacity:.65}.unknown-heading-ring{opacity:.6}</style><h1>Aircraft model and rotorcraft review</h1><p>Illustrative component specimens, not live traffic. Every calibrated footprint below uses the same metre scale.</p><main id="review"></main><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {AircraftMarker,models} from '/src/AircraftSilhouette.jsx';
const h=React.createElement;
createRoot(document.getElementById('review')).render(['A388','A321','CRJ9','AS50','EC35','R44'].map(model=>h('article',{key:model},h('h3',null,models[model]?.name||model),h('svg',{viewBox:'-45 -45 90 90'},h(AircraftMarker,{flight:{model,kind:['AS50','EC35','R44'].includes(model)?'helicopter':'plane',headingKnown:true},size:6})),h('p',null,models[model]?`${models[model].wingspan} m ${models[model].kind==='helicopter'?'rotor diameter':'span'} × ${models[model].length} m overall`:'Rotorcraft category symbol · dimensions unavailable'))));
</script></html>
